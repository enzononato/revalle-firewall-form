<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%">
  <g transform="translate(10, 10)">
    <!-- Tess AI Icon Symbol -->
    <g transform="scale(0.55)">
      <!-- Top Left - Dark Indigo -->
      <rect x="32" y="32" width="88" height="116" rx="44" ry="44" fill="#2D215C" />
      
      <!-- Top Right - Dark Purple -->
      <rect x="108" y="32" width="116" height="88" rx="44" ry="44" fill="#352968" />
      
      <!-- Bottom Right - Lavender Light Pink -->
      <rect x="136" y="108" width="88" height="116" rx="44" ry="44" fill="#EEB7FF" />
      
      <!-- Bottom Left - Coral Red -->
      <rect x="32" y="136" width="116" height="88" rx="44" ry="44" fill="#FF5555" />
    </g>

    <!-- Logo Typography: tess ai -->
    <text x="175" y="100" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="96" font-weight="500" fill="#2D215C" letter-spacing="-2px">tess<tspan font-weight="700" fill="#FF5555">.ai</tspan></text>
  </g>
</svg>
